<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA·3D — Qo‘l bilan boshqariladigan 3D studiya</title>
<style>
:root{--bg:#05030f;--p:#8b5cf6;--b:#38bdf8;--n:#22d3ee;--m:#e879f9;--t:#e8ecff;--d:#8f98c8;--g:rgba(18,14,45,.55);--l:rgba(140,120,255,.22);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:10px;padding:10px;background:radial-gradient(900px 500px at 15% 0,#2a1760 0,transparent 60%),radial-gradient(800px 600px at 100% 100%,#0b3a66 0,transparent 55%),var(--bg)}
.glass{background:var(--g);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--l);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.18em;font-size:15px}
.logo i{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 0deg,var(--p),var(--n),var(--m),var(--p));box-shadow:0 0 22px var(--p);animation:spin 6s linear infinite;display:block}
.logo small{color:var(--d);font-weight:500;letter-spacing:.08em;font-size:10px;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--d);padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid var(--l)}
.dot{width:9px;height:9px;border-radius:50%;background:#64748b}.dot.on{background:#34d399;box-shadow:0 0 12px #34d399;animation:pulse 1.4s infinite}.dot.err{background:#f87171}
@keyframes pulse{50%{transform:scale(1.5);opacity:.6}}
main{display:grid;grid-template-columns:230px 1fr 250px;gap:10px;min-height:0}
aside{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:14px}
h3{font-size:11px;letter-spacing:.18em;color:var(--d);font-weight:700;text-transform:uppercase}
.shapes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.btn{position:relative;border:1px solid var(--l);background:linear-gradient(160deg,rgba(139,92,246,.18),rgba(56,189,248,.08));color:var(--t);border-radius:14px;padding:11px 8px;font:600 12px inherit;font-family:inherit;cursor:pointer;transition:.25s;overflow:hidden}
.btn:hover{transform:translateY(-2px);border-color:var(--n);box-shadow:0 0 22px rgba(34,211,238,.35)}
.btn:active{transform:scale(.95)}
.btn .ic{display:block;font-size:20px;margin-bottom:2px}
.btn.red:hover{border-color:#f87171;box-shadow:0 0 22px rgba(248,113,113,.4)}
.sw{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}
.sw b{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.25s;box-shadow:0 0 14px var(--c);background:var(--c)}
.sw b:hover{transform:scale(1.18)}.sw b.on{border-color:#fff;transform:scale(1.15)}
label{display:flex;justify-content:space-between;font-size:12px;color:var(--d);margin-top:10px}
input[type=range]{width:100%;accent-color:var(--p);margin-top:6px;height:4px}
.tg{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0}
.tg input{appearance:none;width:42px;height:24px;border-radius:99px;background:#2a2550;position:relative;cursor:pointer;transition:.3s;border:1px solid var(--l)}
.tg input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.3s}
.tg input:checked{background:linear-gradient(90deg,var(--p),var(--n));box-shadow:0 0 14px var(--p)}.tg input:checked::after{left:20px}
#stage{position:relative;overflow:hidden;border-radius:24px;border:1px solid var(--l);box-shadow:0 0 60px rgba(139,92,246,.25),inset 0 0 80px rgba(34,211,238,.06);min-height:0;touch-action:none}
canvas#gl{width:100%;height:100%;display:block}
.hud{position:absolute;left:14px;bottom:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;gap:10px}
.hint{font-size:12px;color:var(--d);padding:9px 13px;border-radius:12px;pointer-events:none;max-width:60%}
.cam{pointer-events:auto;width:150px;height:112px;border-radius:16px;overflow:hidden;position:relative;display:none}
.cam.show{display:block}.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cta{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:5;padding:14px 26px;border-radius:99px;border:0;font:700 14px inherit;font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(120deg,var(--p),var(--b),var(--m));background-size:220% 100%;animation:sh 4s linear infinite;box-shadow:0 0 30px rgba(139,92,246,.7),0 8px 30px rgba(0,0,0,.5);transition:.25s;white-space:nowrap}
.cta:hover{transform:translateX(-50%) scale(1.07);box-shadow:0 0 50px rgba(56,189,248,.8)}.cta:active{transform:translateX(-50%) scale(.95)}
@keyframes sh{to{background-position:220% 0}}
#glow{position:fixed;width:300px;height:300px;margin:-150px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(139,92,246,.22),transparent 65%);z-index:2;mix-blend-mode:screen}
.rip{position:fixed;width:12px;height:12px;margin:-6px;border-radius:50%;border:2px solid var(--n);pointer-events:none;z-index:70;animation:rp .7s ease-out forwards}
@keyframes rp{to{transform:scale(8);opacity:0}}
#load{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .8s,visibility .8s}
#load.off{opacity:0;visibility:hidden}
.ld{text-align:center}.ring{width:96px;height:96px;margin:0 auto 22px;border-radius:50%;border:3px solid transparent;border-top-color:var(--n);border-right-color:var(--p);animation:spin 1s linear infinite;box-shadow:0 0 40px rgba(139,92,246,.6)}
.bar{width:220px;height:4px;border-radius:9px;background:#1b1740;margin:16px auto 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--n));transition:width .3s}
.dock{display:none}
@media(max-width:900px){
 main{grid-template-columns:1fr}
 aside{position:fixed;left:10px;right:10px;bottom:calc(70px + env(safe-area-inset-bottom,0px));max-height:46vh;z-index:30;transform:translateY(130%);transition:.4s;background:rgba(10,8,30,.92)}
 aside.open{transform:none}
 .dock{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));gap:8px;z-index:31}.dock .btn{flex:1;padding:14px}
 #stage{margin-bottom:62px}.hint{display:none}.cam{width:110px;height:82px}.cta{font-size:13px;padding:12px 20px}.status span{display:none}
}
body.calm *{animation-duration:0s!important}
</style>
</head>
<body>
<div id="load"><div class="ld"><div class="ring"></div><div class="logo" style="justify-content:center">NOVA·3D</div><div class="bar"><i id="lb"></i></div><small id="lt" style="color:var(--d);font-size:11px;display:block;margin-top:10px">Yuklanmoqda…</small></div></div>
<div id="glow"></div>
<div id="app">
<header class="glass">
 <div class="logo"><i></i><div>NOVA·3D<small>QOʻL BILAN BOSHQARUV STUDIYASI</small></div></div>
 <div class="status"><i class="dot" id="dot"></i><b id="st" style="font-weight:600">Kamera oʻchiq</b></div>
 <button class="btn" id="setBtn" style="padding:9px 14px">⚙ <span class="s2">Sozlamalar</span></button>
</header>
<main>
 <aside class="glass" id="left">
  <div><h3>Shakllar kutubxonasi</h3><div class="shapes" id="shapes"></div></div>
  <div><h3>Rang</h3><div class="sw" id="sw"></div></div>
  <button class="btn red" id="del">🗑 Tanlanganini oʻchirish</button>
 </aside>
 <section id="stage">
  <canvas id="gl"></canvas>
  <button class="cta" id="camBtn">📷 Kamerani yoqish va boshqarishni boshlash</button>
  <div class="hud"><div class="hint glass">Sichqoncha/barmoq: aylantirish · Gʻildirak: oʻlcham · Qoʻl: siljitish, chimdish — kattalashtirish</div>
   <div class="cam glass" id="cam"><video id="vid" playsinline muted></video><canvas id="ov"></canvas></div></div>
 </section>
 <aside class="glass" id="right">
  <div><h3>Boshqaruv</h3>
   <label>Oʻlcham <span id="v1">1.0</span></label><input type="range" id="size" min="0.4" max="2.6" step="0.05" value="1.2">
   <label>Aylanish tezligi <span id="v2">1.0</span></label><input type="range" id="spd" min="0" max="4" step="0.1" value="1">
   <label>Yorugʻlik kuchi <span id="v3">1.0</span></label><input type="range" id="lum" min="0" max="3" step="0.1" value="1.2"></div>
  <div><h3>Effektlar</h3>
   <div class="tg">Yorugʻlik izlari<input type="checkbox" id="fxT" checked></div>
   <div class="tg">3D zarrachalar<input type="checkbox" id="fxP" checked></div>
   <div class="tg">Neon toʻr (wireframe)<input type="checkbox" id="fxW" checked></div>
   <div class="tg">Animatsiyalar<input type="checkbox" id="fxA" checked></div></div>
  <button class="btn" id="rst">↺ Tanlanganni tiklash</button>
 </aside>
</main>
</div>
<div class="dock"><button class="btn" data-o="left">◆ Shakllar</button><button class="btn" data-o="right">⚙ Boshqaruv</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

var sh=$("shapes");
defs.forEach(function(d,i){var b=document.createElement("button");b.className="btn";b.innerHTML='<span class="ic">'+d.ic+'</span>'+d.n;b.onclick=function(){add(i,(Math.random()-.5)*(items.length?5:0),(Math.random()-.5)*(items.length?3:0));burst(0,0)};sh.appendChild(b)});
var sw=$("sw");
cols.forEach(function(c,i){var b=document.createElement("b");b.style.setProperty("--c",c);if(!i)b.className="on";b.onclick=function(){cur=c;[].forEach.call(sw.children,function(x){x.className=""});b.className="on";if(sel){var cc=new THREE.Color(c);sel.userData.m.material.color.copy(cc);sel.userData.m.material.emissive.copy(cc)}};sw.appendChild(b)});

function skinTrack(){
